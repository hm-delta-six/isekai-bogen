name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version und Download-URL aus dem Tag setzen
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
            manifest.version = process.env.TAG.replace(/^v/, "");
            manifest.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(`Release ${manifest.version} -> ${manifest.download}`);
          '

      - name: Modul packen
        run: zip -r module.zip module.json scripts templates

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
